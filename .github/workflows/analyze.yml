name: Kalshi weather analysis

on:
  schedule:
    # 6:05 AM/PM US Eastern in winter, 7:05 in summer: always before the 7:41 Claude check-ins.
    - cron: "5 11 * * *"
    - cron: "5 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline self-test
        run: python tests/test_offline.py
      - name: Live analysis
        run: python weather_bot.py
      - name: Commit results
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git commit -m "analysis $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
